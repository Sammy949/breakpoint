<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Breakpoint</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { max-width: 420px; margin: 0 auto; padding: 32px 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #B5B5B5; }
      label { display: block; margin: 16px 0 6px; font-weight: 600; }
      input {
        width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px;
        background: #1A1A1A; color: #E5E5E5; border: 1px solid #555; border-radius: 8px;
      }
      input:focus-visible, button:focus-visible { outline: 2px solid #E5E5E5; outline-offset: 2px; }
      button {
        margin-top: 20px; width: 100%; min-height: 48px; font-size: 16px; font-weight: 600;
        background: #E5E5E5; color: #232323; border: 0; border-radius: 8px;
      }
      #pair-status { margin-top: 16px; min-height: 1.4em; color: #E5E5E5; }
      fieldset { margin-top: 28px; border: 1px solid #555; border-radius: 8px; padding: 12px 16px 16px; }
      legend { font-weight: 600; padding: 0 6px; }
      fieldset label { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 0; font-weight: 400; }
      fieldset input { width: 20px; height: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Breakpoint</h1>
      <p>Run <code>bun scripts/pair.ts &lt;relay-url&gt;</code> on your laptop, then enter the relay URL and the code it prints.</p>
      <form id="pair">
        <label for="relay">Relay URL</label>
        <input id="relay" name="relay" type="url" inputmode="url" autocomplete="off" required placeholder="https://…" />
        <label for="code">Pairing code</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required placeholder="123 456" />
        <button type="submit">Pair</button>
      </form>
      <p id="pair-status" role="status"></p>
      <fieldset>
        <legend>Attention (for demos)</legend>
        <p>Auto waits for a break when you're talking or moving. Busy and Free force it.</p>
        <label><input type="radio" name="attention" value="auto" checked /> Auto</label>
        <label><input type="radio" name="attention" value="busy" /> Busy</label>
        <label><input type="radio" name="attention" value="free" /> Free</label>
      </fieldset>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
