<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Social preview / README hero, 1280×640</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1280px; height: 640px; display: grid; grid-template-columns: 1fr 518px; gap: 64px; align-items: center; padding: 0 80px; }
  .lockup { gap: 18px; margin-bottom: 56px; }
  .lockup img { width: 50px; height: 60px; }
  .wordmark { font-size: 40px; }
  h1 { font-size: 44px; line-height: 1.15; margin-bottom: 24px; }
  p { font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: 30em; }
  figure { margin: 0; }
  figure img { display: block; width: 518px; height: auto; background: #000; border: 1px solid var(--line); border-radius: 10px; }
  figcaption { margin-top: 12px; font-size: 14px; color: var(--ink-3); }
</style>
</head>
<body>
  <div>
    <div class="lockup"><img src="../mark.svg" alt=""><span class="wordmark">breakpoint</span></div>
    <h1>Claude Code's approvals and plans, on your Even G2.</h1>
    <p>Safe requests wait for a break. Destructive ones interrupt, and take a gesture you have to read before you can approve them.</p>
  </div>
  <figure>
    <img src="../../docs/destructive-card.png" alt="">
    <figcaption>Even Hub simulator capture</figcaption>
  </figure>
</body>
</html>
