<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Video opening card, 1920×1080</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1920px; height: 1080px; padding: 120px 140px 96px; display: flex; flex-direction: column; }
  .lockup { gap: 36px; }
  .lockup img { width: 100px; height: 120px; }
  .wordmark { font-size: 96px; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 84px; line-height: 1.1; max-width: 1560px; margin-bottom: 44px; }
  main p { font-size: 34px; line-height: 1.4; color: var(--ink-2); }
  footer { display: flex; justify-content: space-between; font-size: 26px; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="lockup"><img src="../mark.svg" alt=""><span class="wordmark">breakpoint</span></div>
  <main>
    <h1>AI coding agents stop and ask before risky actions. Most people approve without reading.</h1>
    <p>Anthropic reports users approve 97% of Claude Code's permission prompts.</p>
  </main>
  <footer><span>Heads Up hackathon · Even Realities G2</span><span>github.com/Sammy949/breakpoint</span></footer>
</body>
</html>
